summary: >-
  Cross-cutting API conventions for LiveAction's product-embedded REST APIs
  (LiveNX, and the LiveWire / Omnipeek Capture Engine REST-API). These APIs run
  on customer-operated appliances/deployments, so there is no single hosted base
  URL. Only conventions the vendor documents are captured here; unstated
  behaviors (pagination style, idempotency semantics, error envelope) are left
  null rather than invented, because LiveAction publishes no public OpenAPI
  specification (the API reference is served from the in-product admin/user
  menu).
