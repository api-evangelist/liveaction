aid: liveaction
name: LiveAction
description: >-
  LiveAction is a network observability and intelligence platform that provides
  visibility and monitoring across physical, virtual, cloud, and SD-WAN
  infrastructure. Its product family includes LiveNX (network performance
  monitoring using flow, API, SNMP, and cloud telemetry), LiveWire (network
  forensics and packet capture), LiveSP (monitoring for service providers), and
  Omnipeek (protocol analyzer), alongside AI-driven operations offerings.
  LiveAction's products expose product-embedded REST APIs authenticated with API
  tokens for automation and integration; there is no public hosted developer API
  or OpenAPI specification, as the APIs run on customer-operated deployments and
  the reference is served in-product. LiveAction is part of BlueCat Networks and
  a portfolio company of Insight Partners.
